name: Check for New Jobs

on:
  schedule:
    # Fallback only: GitHub delays and drops scheduled runs, so an external
    # scheduler should send repository_dispatch every 15-30 minutes (see README).
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto = lists every run, career pages when due; fast = lists only; full = everything'
        type: choice
        options: [auto, fast, full]
        default: auto
  repository_dispatch:
    types: [check-jobs]

permissions:
  contents: write  # push the job-tracker-state branch

concurrency:
  group: hourly-job-tracker
  cancel-in-progress: false

env:
  STATE_FILE: .state/state.json

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore durable state
        id: state
        run: scripts/state_branch.sh restore "$STATE_FILE"

      # Only used until the state branch exists (migration from the cache-only
      # setup) or if it is ever deleted.
      - name: Restore legacy job database
        if: steps.state.outputs.found != 'true'
        uses: actions/cache/restore@v4
        with:
          path: jobs.db
          key: jobs-db-${{ github.run_id }}
          restore-keys: |
            jobs-db-

      - name: Choose scan mode
        id: mode
        env:
          INPUT_MODE: ${{ github.event.inputs.mode || github.event.client_payload.mode || 'auto' }}
        run: |
          case "$INPUT_MODE" in
            auto|fast|full) echo "mode=$INPUT_MODE" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unknown mode '$INPUT_MODE'; using auto"; echo "mode=auto" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Run job tracker
        # Shorter than the job timeout, so the persist step below still runs
        # and saves the state file the tracker writes after every batch.
        timeout-minutes: 15
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ASSISTANT_WEBHOOK_URL: ${{ secrets.ASSISTANT_WEBHOOK_URL }}
          ASSISTANT_WEBHOOK_KEY: ${{ secrets.ASSISTANT_WEBHOOK_KEY }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: python main.py --notify --mode "$MODE" --state-file "$STATE_FILE"

      - name: Persist durable state
        if: always()
        run: scripts/state_branch.sh save "$STATE_FILE"
